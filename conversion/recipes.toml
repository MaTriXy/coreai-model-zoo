# Zoo conversion recipes — the configuration that produced each published bundle.
#
#   python3 zoo_convert.py list
#   python3 zoo_convert.py show qwen3.5-0.8b
#   python3 zoo_convert.py run qwen3.5-0.8b --dry-run
#
# An index, not a new source of truth: every entry mirrors a bundle already published on
# Hugging Face and documented in the model's zoo card.
#
# ## What an entry records
#
#   script / args     THE configuration that produced `bundle` — not the option list. Where a
#   command           card compares fp16 / int8 / int4, only the shipped one belongs here.
#   steps             multi-graph ports: the whole set, in order.
#   hf_repo / bundle  the published artifact this reproduces. `bundle` is the directory inside
#                     the repo, so zoo_verify.py and the inventory line up against it.
#   status            "verified" — the card documents the command AND the published bundle name
#                       is what that command produces (two independent records agreeing), or the
#                       exporter's naming rule determines the arguments outright.
#                     "unverified" — the repo does not record which configuration shipped. The
#                       known part is written down and `open_questions` states exactly what is
#                       missing. Arguments are never guessed; a wrong recipe is worse than none.
#
# ## Prerequisites — split by who needs them
#
#   overlay           export-time: the script imports re-authored model code, so the interpreter
#                     needs coreai_models WITH conversion/overlay/ applied (`zoo_convert doctor`).
#   needs             export-time: anything else the export cannot run without (a checkpoint
#                     download, a gather-table dump, a package patch).
#   runtime_patches   run-time: engine patches the *app* needs to run the bundle correctly.
#   runtime_env       run-time: environment the engine needs (e.g. COREAI_CHUNK_THRESHOLD=1).
#   aot               the device bundle is AOT-compiled after export; the command is recorded.
#
# Runtime prerequisites do not affect the export. They are here because a bundle reproduced
# without them looks fine and then misbehaves in the app, which is the failure this file exists
# to prevent.

