name: coreai-audio
options:
  bundleIdPrefix: com.daisukemajima
  createIntermediateGroups: true

packages:
  coreai-models:
    path: ../../coreai-models
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.3"

# Release: the engine's per-token host work is ~3x slower unoptimized.
schemes:
  coreai-audio:
    build:
      targets:
        coreai-audio: all
    run:
      config: Release

targets:
  coreai-audio:
    type: application
    # iOS (AOT .aimodelc decoder) + macOS (JIT .aimodel). Audio understanding = Qwen2.5-Omni
    # Thinker; the audio embeds ride one static graph input on the pipelined engine.
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
      - path: ../AppShared/ModelDownloader.swift
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: coreai-models
        product: CoreAIShared
      # Pipelined LLM engine (EngineFactory / LanguageBundle / EngineOptions.staticInputBuffers).
      # Requires the engine patch stack on the coreai-models clone (see apps/README.md).
      - package: coreai-models
        product: CoreAILM
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daisukemajima.coreaiaudio
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        # The 3.9 GB decoder cold-specializes past the default jetsam limit on iPhone.
        CODE_SIGN_ENTITLEMENTS: coreai-audio.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "coreai-audio sends audio you record or choose to a local audio-understanding model on this device. Nothing leaves your device."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
