name: coreai-audio
options:
  bundleIdPrefix: com.daisukemajima
  createIntermediateGroups: true

# Depends on the CoreAIKit *library* (not raw coreai-models products). The library packages the
# swift-transformers / swift-crypto resource bundles so they code-sign cleanly on device — the
# self-contained raw-deps build hit "code object is not signed at all" on those bundles.
packages:
  # VoxCPMTTS + VoxCPM2TTS (0.5B "Voice" + 2B "Voice 2B" tabs) + KitWhisperModel/KitASRModel.
  coreai-kit:
    url: https://github.com/john-rocky/coreai-kit
    revision: dbb2ab0d47fb32f6731758a5aaa5c9a50b2d9555
  # On-device English G2P for free-text TTS (made for Kokoro; pulls in MLX for the
  # neural fallback on out-of-dictionary words).
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift
    revision: 6835a1ce4a8854075c89f18ff75c74b13ef58e15

# Release: the engine's per-token host work is ~3x slower unoptimized.
schemes:
  coreai-audio:
    build:
      targets:
        coreai-audio: all
    run:
      config: Release

targets:
  coreai-audio:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "27.0"
      macOS: "27.0"
    sources:
      - path: Sources
        excludes:
          - KokoroAssets       # 3 .aimodel (321 MB) — downloaded from HF at runtime (dev: from disk)
          - KokoroResources    # added below as a folder-reference resource
          - VoxCPMAssets       # 5 bundles + glue + tokenizer (~1.3 GB) — dev symlink, loaded via #filePath
      - path: Sources/KokoroResources   # vocab/voices/l_linear/demo_phrases — bundled into the app
        type: folder
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - package: coreai-kit
        product: CoreAIKitVision
      - package: MisakiSwift
        product: MisakiSwift
        embed: true
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daisukemajima.coreaiaudio
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        # The 3.9 GB decoder cold-loads past the default jetsam limit on iPhone.
        CODE_SIGN_ENTITLEMENTS: coreai-audio.entitlements
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "coreai-audio sends audio you record or choose to a local audio-understanding model on this device. Nothing leaves your device."
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
