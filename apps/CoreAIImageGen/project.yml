name: CoreAIImageGen
options:
  bundleIdPrefix: com.coreai
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"

packages:
  # Fork of apple/coreai-models @ 02a8edd + the in-context edit path (Flux2Pipeline.editImages
  # + the transformer_edit export recipe), on the `flux2-in-context-edit` branch. The stock
  # apple runtime does text/image-to-image only; this branch adds the Edit tab's runtime.
  coreai-models:
    url: https://github.com/john-rocky/coreai-models
    revision: bc48d3d07e03ce90a4a05d3264dca4c4c40ac81f

schemes:
  CoreAIImageGen:
    build:
      targets:
        CoreAIImageGen: all
    run:
      config: Release
  CoreAIImageGenMac:
    build:
      targets:
        CoreAIImageGenMac: all
    run:
      config: Release

targets:
  # iOS — runs the lighter 512 / half bundle (~4 GB int4).
  CoreAIImageGen:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: ../AppShared/ModelDownloader.swift
    # The ~4 GB int4 bundle needs the increased-memory-limit entitlement to avoid jetsam
    # on load (12 GB devices, e.g. iPhone 17 Pro).
    entitlements:
      path: CoreAIImageGen.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: coreai-models
        product: CoreAIDiffusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai.imagegen.ios
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        # Only HTTPS (Hugging Face downloads) — exempt from export-compliance prompts.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"

  # macOS — runs the full 1024 bundle.
  CoreAIImageGenMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      - path: ../AppShared/ModelDownloader.swift
    dependencies:
      - package: coreai-models
        product: CoreAIDiffusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai.imagegenmac
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_APPROACHABLE_CONCURRENCY: "YES"
