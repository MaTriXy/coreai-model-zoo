# Recipe for glm-image — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["glm-image"]
card = "README.md"
hf_repo = "mlboydaisuke/GLM-Image-CoreAI"
status = "verified"
steps = [
  { script = "export_glm_image_ar.py", args = ["int8lin"], bundle = "glm_image_ar.aimodelc" },
  { script = "export_glm_image_dit.py", args = ["int8lin", "--size", "512"], bundle = "glm_image_dit_512.aimodelc" },
  { script = "export_glm_image_dit.py", args = ["int8lin", "--size", "1024"], bundle = "glm_image_dit_1024.aimodelc" },
  { script = "export_glm_image_vae_fp32.py", args = ["--size", "512"], bundle = "glm_image_vae_512.aimodel" },
  { script = "export_glm_image_vae_fp32.py", args = ["--size", "1024"], bundle = "glm_image_vae_1024.aimodel" },
]
notes = [
  "knowledge/glm-image-port.md records the precision per net: AR int8lin per-block-32, DiT",
  "int8lin, VAE **fp32** — fp16 overflows its activations into NaN black frames, which is why",
  "the fp32 exporter is the one that ships. int8lin is also both exporters' default.",
  "The upload flattened the names (glm_image_dit_512_int8lin -> glm_image_dit_512), so the",
  "published names cannot confirm the mode on their own; the port notes are the record.",
  "The .aimodelc pair is AOT-compiled after export. The glyph text encoder is deliberately not",
  "exported — glyph-free prompts embed a constant, shipped as ehs.f32.",
  "This port is still in flight; treat the published set as its current state, not a final ship.",
]
