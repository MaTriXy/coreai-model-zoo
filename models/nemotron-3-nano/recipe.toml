# Recipe for nemotron-3-nano — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["nemotron-3-nano-4b"]
script = "export_nemotron_h_decode_pipelined.py"
args = ["int8hu", "--head-sym"]
card = "README.md"
hf_repo = "mlboydaisuke/Nemotron-3-Nano-4B-CoreAI"
bundle = "gpu-pipelined/nemotron_3_nano_4b_decode_int8hu"
status = "verified"
overlay = true
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
aot = "xcrun coreai-build compile exports/<name>/<name>.aimodel --platform iOS --preferred-compute gpu --architecture h18p --output exports/<name>"
notes = [
  "Recorded command: conversion/_nemotron_h_hf_upload.py — the script that published this repo —",
  "documents `export_nemotron_h_decode_pipelined.py int8hu --head-sym` plus the AOT step above.",
  "The card states int8 at 16.0 tok/s is the ship shape. An iOS AOT twin is published too.",
]

