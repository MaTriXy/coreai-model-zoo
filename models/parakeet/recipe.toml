# Recipe for parakeet — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["parakeet-tdt-0.6b"]
card = "README.md"
hf_repo = "mlboydaisuke/Parakeet-TDT-0.6B-CoreAI"
status = "verified"
steps = [
  { script = "parakeet/export_encoder.py", args = [], bundle = "parakeet_encoder_float16_L2885.aimodel" },
  { script = "parakeet/export_decoder.py", args = ["--dtype", "float32"], bundle = "parakeet_predict_float32.aimodel" },
]
notes = [
  "The encoder takes no length flag — L2885 (30 s of frames) is baked into the graph — and its",
  "only knob, --dtype, is float16 in the published name. One decoder run emits both published",
  "float32 graphs (predict + joint), which is that exporter's documented default.",
]
