# Recipe for mineru — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["mineru-2.5-pro"]
card = "README.md"
hf_repo = "mlboydaisuke/MinerU2.5-Pro-CoreAI"
script = "export_mineru_pipelined.py"
args = ["int8lin"]
bundle = "decoder"
status = "verified"
overlay = true
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
notes = [
  "Recorded mode: conversion/_mineru_hf_upload.py publishes \"vision (fp16) + decoder (int8lin S=1)\".",
  "The layout/ pair is the same graph run over the layout model; its metadata pointed at a local",
  "path until 2026-07-25.",
  "Downloaded checkpoint dir: ZOO_WORK_ROOT/_mineru_dl (see conversion/_paths.py).",
]
