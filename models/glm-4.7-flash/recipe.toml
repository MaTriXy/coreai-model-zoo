# Recipe for glm-4.7-flash — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["glm-4.7-flash"]
script = "export_glm47_moe_metal_decode_pipelined.py"
args = ["sym8"]
card = "README.md"
hf_repo = "mlboydaisuke/GLM-4.7-Flash-CoreAI"
bundle = "gpu-pipelined/glm_4_7_flash_decode_sym8_gather"
status = "unverified"
overlay = true
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
open_questions = [
  "Was --head-sym / --head-quant passed? Asked and closed as unknowable on 2026-07-25: the owner",
  "does not recall, and nothing published records it — the bundle name omits the head flags, the",
  "metadata declares no compression, and unlike embeddinggemma this repo ships no reference.json.",
  "For the twin port (qwen3.6-35b-a3b) knowledge/ recorded a bare `sym8`, but that is not evidence",
  "for this one. Settling it needs a re-export of the lm_head under both settings and a byte",
  "comparison against the published 30 GB bundle — the only remaining route. `sym8` alone (the",
  "args above) is the defensible partial record until then.",
]
notes = [
  "The zoo's first MLA + MoE port. Card: sym8 gather = SHIP (30 GB, 53.6 tok/s, clean).",
  "The card's 'convert with' line names export_glm47_decode_pipelined.py int8hu --head-sym, which",
  "is the pre-gather-kernel build and was not the artifact published.",
]

