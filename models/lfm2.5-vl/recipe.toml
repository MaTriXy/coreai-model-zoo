# Recipe for lfm2.5-vl — the configuration that produced each bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["lfm2.5-vl-450m"]
script = "export_lfm25vl_pipelined.py"
args = ["int8lin", "--vision-mode", "fp16"]
card = "README.md"
hf_repo = "mlboydaisuke/LFM2.5-VL-450M-CoreAI"
source_hf_id = "LiquidAI/LFM2.5-VL-450M"
source_revision = "fc6221ca597f3315e4f82fc2df606783267b34ba"
bundle = "gpu-pipelined/lfm2_5_vl_450m_decode_int8lin"
status = "verified"
overlay = true
runtime_patches = [
  "apps/coreai-pipelined-extra-states.patch",
  "apps/coreai-pipelined-static-inputs.patch",
]
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
notes = [
  "One run emits BOTH bundles: the fp16 vision tower (181MB) and the int8lin VLM decoder (477MB).",
  "The pair is the ship: 658MB total, the smallest VLM in this catalog.",
  "Vision = SigLIP2 NaFlex at a baked 32x32 patch grid (one 512x512 tile -> 256 tokens =",
  "the checkpoint's own max_image_tokens). Host patchifies; the graph never sees an image.",
  "Decoder = the shipped LFM2 hybrid reached by a model.language_model. key prefix, plus an",
  "image_embeds static input and extension ids V+slot.",
  "M4 Max: vision 18.0 ms/image; text core 609.2 prefill / 387.2 decode tok/s.",
  "iPhone 17 Pro (AOT h18p, PipelinedBench): 123.2 prefill / 112.0 decode with the image",
  "buffer bound, nat 16/16 + image oracle 24/24; PB_G=1024 clean (dynamic-KV check).",
  "Vision tower on the same phone: 33.6 ms/image, cos 0.999995 vs its own Mac output;",
  "the first-ever encode pays ~860ms of on-device compile, so warm it at load.",
  "Gates: fp32 torch ladder cos 1.000000 at every seam + 48/48; engine fp16 logits cos 0.999994;",
  "9-case suite 7/9 token-exact at int8lin (fp16 baseline is 8/9 -- greedy near-ties, not damage);",
  "coreai_gate.py PASS 16/16 on the text core.",
]
open_questions = [
  "On device the image path drops one adjective vs fp32 at a near-tie (same picture, same",
  "middle ten tokens); the device gate checks the device-verified sequence.",
  "The baked square grid stretches non-square images, which is the one thing NaFlex avoids.",
  "No gate here can see that cost: the fixed-grid oracle is captured through the same stretch.",
]

["lfm2.5-vl-450m-textcore"]
