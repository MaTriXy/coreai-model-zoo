notes = [
  "HF-id swap only: the wider tower (hidden 1152, 27L) and the 30L/128k decoder come off the",
  "config, and vision_block_size picks int8 per-block-16 by itself (the tower's MLP is 4304).",
  "M4 Max: vision 75.7 ms/image; text core 120.9 prefill / 105.3 decode tok/s.",
  "Gates: fp32 torch ladder cos 1.000000 at every seam + 48/48 (fp16 too, and the NumPy host);",
  "engine vision cos 0.999995, decoder fp16 48/48 cos 0.999999; 9-case suite 7/9 at int8lin,",
  "int4lin and fp16 alike -- int4 costs this size nothing, unlike the 450M (0/9).",
  "Two host details differ from the 450M: resample 3 (BICUBIC) and a tokenizer that does NOT",
  "prepend <|startoftext|> (without it the model answers ' F, F, F, F').",
]
open_questions = [
  "Mac-only: the int8lin AOT resources.bin is 3.13 GiB and int4lin 2.03 GiB, both past the",
  "iOS 2 GiB load wall. The remaining lever is the 524MB fp16 embedding, tied to the head and",
  "so not quantizable in place; after that it is a split graph. No iPhone number exists.",
  "The baked square grid stretches non-square images, as on the 450M, and no gate sees it.",
]

