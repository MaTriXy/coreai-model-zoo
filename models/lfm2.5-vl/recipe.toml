args = ["int8lin", "--text-core", "--skip-vision"]
card = "README.md"
hf_repo = "mlboydaisuke/LFM2.5-VL-450M-CoreAI"
source_hf_id = "LiquidAI/LFM2.5-VL-450M"
source_revision = "fc6221ca597f3315e4f82fc2df606783267b34ba"
bundle = "gpu-pipelined/lfm2_5_vl_450m_decode_int8lin_textcore"
status = "verified"
overlay = true
runtime_patches = ["apps/coreai-pipelined-extra-states.patch"]
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
notes = [
  "The same decoder weights with NO image input: a working 350M LFM2 text bundle, and the only",
  "way to measure this port on Mac -- llm-runner cannot bind the VLM bundle's image_embeds",
  "buffer, so llm-benchmark and coreai_gate.py both run this instead (the MiniCPM-V-4.6 card",
  "documents the same substitution).",
  "coreai_gate.py PASS 16/16, transcript at gate-lfm2.5-vl-450m-textcore-int8lin.json.",
]

