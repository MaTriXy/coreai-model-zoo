# Declared deviations from the source repository, for conversion/zoo_verify.py.

[config]
# <turn|> is Gemma 4's turn terminator (upstream's `eot_token`); <eos> ends the whole
# sequence. These bundles have shipped the correct one since export.
eos_token = "<turn|>"
bos_token = "<bos>"

