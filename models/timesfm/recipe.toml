# Recipe for timesfm — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["timesfm-2.5-200m"]
script = "timesfm/export_timesfm.py"
args = ["--ctx", "2048", "--dtype", "fp16"]
card = "README.md"
hf_repo = "mlboydaisuke/TimesFM-2.5-200M-CoreAI"
bundle = "timesfm_2p5_200m_ctx2048_fp16.aimodel"
status = "verified"
aot = "xcrun coreai-build compile timesfm_2p5_200m_ctx2048_fp16.aimodel --output ios/ --platform iOS --architecture h18p --preferred-compute gpu --min-deployment-version 27.0"
notes = ["Context length and dtype are both in the bundle name, so it determines the command."]
