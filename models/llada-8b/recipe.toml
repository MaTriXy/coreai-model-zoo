# Recipe for llada-8b — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["llada-8b-dllm"]
script = "dllm/export_llada.py"
args = ["--mode", "int4hu", "--seq", "256"]
card = "README.md"
hf_repo = "mlboydaisuke/LLaDA-8B-dLLM-CoreAI"
bundle = "macos"
status = "verified"
notes = [
  "The card records the shipped shape — int4 per-block-32 body + int8 head, 4.9 GB, S=256 canvas",
  "— and the exporter's own usage documents that shape as `--mode int4hu`; the published bundle's",
  "metadata confirms the 256-token canvas. int4lin (fp16 head) and fp16 are the other modes.",
  "Diffusion LLM: no KV cache, whole-sequence denoising. Mac-only.",
]
