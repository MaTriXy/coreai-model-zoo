# Recipe for glm-ocr — the configuration that produced each published bundle.
# Schema and the rules for `status`: ../README.md.
# Run it with:  python3 ../../conversion/zoo_convert.py run <name>

["glm-ocr"]
card = "README.md"
hf_repo = "mlboydaisuke/GLM-OCR-CoreAI"
script = "export_glm_ocr_pipelined.py"
args = ["int8hu"]
bundle = "decoder"
status = "verified"
overlay = true
runtime_env = { COREAI_CHUNK_THRESHOLD = "1" }
notes = [
  "Recorded mode: conversion/_glmocr_hf_upload.py publishes \"vision (fp16) + decoder (int8hu S=1)\"",
  "— the exporter names it glm_ocr_decode_int8hu; the upload renames it to decoder/.",
  "The vision tower comes from the same run.",
  "Downloaded checkpoint dir: ZOO_WORK_ROOT/_glmocr_dl (see conversion/_paths.py).",
]
